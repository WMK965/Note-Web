<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    <title>Note-Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="library" class="view">
    <header class="lib-header">
        <div class="lib-top">
            <div id="breadcrumb" class="breadcrumb"></div>
            <span id="cache-stats" class="cache-stats">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="var(--border)" stroke-width="3"/>
                    <circle id="cache-ring" cx="12" cy="12" r="10" fill="none" stroke="var(--accent)" stroke-width="3"
                        stroke-linecap="round" stroke-dasharray="62.832" stroke-dashoffset="62.832" transform="rotate(-90,12,12)"/>
                </svg>
                <span class="cache-tooltip" id="cache-tooltip"></span>
            </span>
        </div>
        <input type="search" id="search" placeholder="搜索..." autocomplete="off">
    </header>
    <div id="pdf-list" class="pdf-list"></div>
</div>

<div id="reader" class="view hidden">
    <header class="reader-header">
        <button id="back-btn" class="icon-btn" aria-label="返回">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="marks-btn" class="icon-btn" aria-label="目录">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <span id="reader-title" class="reader-title"></span>
        <button id="home-btn" class="icon-btn" aria-label="首页">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </button>
        <button id="jump-back-btn" class="icon-btn" disabled aria-label="跳回">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
        <button id="jump-forward-btn" class="icon-btn" disabled aria-label="跳前">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
        </button>
        <button id="reader-pin" class="icon-btn pin-btn" aria-label="缓存"></button>
    </header>
    <div id="page-area" class="page-area">
        <div id="page-loader" class="page-loader hidden">
            <div class="spinner"></div>
            <span>渲染中...</span>
        </div>
        <div id="base-wrapper" class="page-wrapper">
            <img id="page-base" class="page-img" alt="">
        </div>
        <div id="overlay-wrapper" class="page-wrapper" style="display:none">
            <img id="page-overlay" class="page-img" alt="">
        </div>
        <div id="tap-left" class="tap-zone tap-left"></div>
        <div id="tap-right" class="tap-zone tap-right"></div>
    </div>
    <footer class="reader-footer">
        <button id="prev-btn" class="nav-btn" aria-label="上一页">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="page-nav">
            <input type="number" id="page-input" min="1" value="1" inputmode="numeric">
            <span class="page-sep">/</span>
            <span id="page-total">1</span>
        </div>
        <button id="next-btn" class="nav-btn" aria-label="下一页">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </footer>
</div>

<div id="marks-backdrop" class="marks-backdrop hidden"></div>
<div id="marks-sidebar" class="marks-sidebar hidden">
    <div class="marks-sidebar-header">
        <h2>目录与标记</h2>
        <button id="marks-close" class="icon-btn" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
    </div>
    <div id="marks-list" class="marks-list"></div>
    <div class="marks-add">
        <div class="marks-menu-wrap">
            <button id="batch-add-btn" class="batch-btn" aria-label="目录与标记选项" aria-haspopup="true" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <div id="marks-menu" class="marks-menu hidden">
                <button id="menu-batch-add" class="marks-menu-item" type="button">
                    <span>批量添加目录</span>
                </button>
                <label class="marks-menu-item" for="deep-scan-input">
                    <span>目录深度扫描</span>
                    <input type="checkbox" id="deep-scan-input" class="menu-switch">
                </label>
            </div>
        </div>
        <input type="text" id="mark-title-input" placeholder="标记当前页..." maxlength="50">
        <button id="mark-add-btn" class="mark-add-btn" aria-label="添加">+</button>
    </div>
</div>

<div id="batch-modal" class="batch-modal hidden">
    <div class="batch-modal-content">
        <div class="batch-modal-header">
            <h3>批量添加目录</h3>
            <button id="batch-close" class="icon-btn" aria-label="关闭">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <p class="batch-hint">每行一个，格式：标题 -- 页码</p>
        <textarea id="batch-input" class="batch-input" placeholder="1 呼吸 -- 1&#10;1.1 肺通气 -- 3&#10;1.2 气体交换 -- 5&#10;2 循环 -- 10&#10;附录 -- 0"></textarea>
        <div class="batch-actions">
            <button id="batch-cancel" class="batch-cancel-btn">取消</button>
            <button id="batch-confirm" class="batch-confirm-btn">添加</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
